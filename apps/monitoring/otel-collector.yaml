# OTel Collector — telemetry collector (runs as DaemonSet, one pod per node)
# Reads pod logs from /var/log/pods on the host filesystem → ships to Loki
# Scrapes Prometheus metrics from annotated pods + kubelet → ships to Mimir
# Receives OTLP traces from apps → forwards to Tempo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: opentelemetry-collector
      repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      targetRevision: 0.165.0
      helm:
        values: |
          mode: daemonset

          image:
            repository: otel/opentelemetry-collector-contrib

          # logsCollection wires up the filelog receiver + hostPath mounts for /var/log/pods
          # kubernetesAttributes wires up the k8sattributes processor (namespace/pod/container labels)
          presets:
            logsCollection:
              enabled: true
            kubernetesAttributes:
              enabled: true

          # kubernetesAttributes preset RBAC covers pods/namespaces/replicasets only.
          # The kubelet scrape job below discovers nodes, which needs its own RBAC rule.
          clusterRole:
            create: true
            rules:
              - apiGroups: [""]
                resources: ["nodes"]
                verbs: ["get", "list", "watch"]

          config:
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318

              prometheus:
                config:
                  scrape_configs:
                    - job_name: kubernetes-pods
                      kubernetes_sd_configs:
                        - role: pod
                      relabel_configs:
                        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                          action: keep
                          regex: "true"
                        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                          action: replace
                          target_label: __metrics_path__
                          regex: "(.+)"
                        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                          action: replace
                          regex: '(.+):(?:\d+);(\d+)'
                          replacement: '$1:$2'
                          target_label: __address__
                    - job_name: kubelet
                      kubernetes_sd_configs:
                        - role: node
                      scheme: https
                      tls_config:
                        insecure_skip_verify: true
                      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

            processors:
              batch: {}

            exporters:
              loki:
                endpoint: http://loki-gateway.monitoring.svc/loki/api/v1/push
              prometheusremotewrite:
                endpoint: http://mimir-nginx.monitoring.svc/api/v1/push
              otlp/tempo:
                endpoint: tempo.monitoring.svc:4317
                tls:
                  insecure: true

            service:
              pipelines:
                traces:
                  receivers: [otlp]
                  processors: [batch]
                  exporters: [otlp/tempo]
                metrics:
                  receivers: [prometheus]
                  processors: [batch]
                  exporters: [prometheusremotewrite]
                logs:
                  processors: [batch]
                  exporters: [loki]

  destination:
    namespace: monitoring
    name: in-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
