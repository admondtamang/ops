name: goserver

on:
  push:
    branches: [main]
    paths:
      - "exmaples/goserver/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push image
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u admondtamang --password-stdin
          # Read the tag pinned in the manifest — CI builds exactly that, no commit-back needed
          TAG=$(grep 'image: admondtamang/myapp:' manifests/myapp/deployment.yml | awk -F: '{print $3}')
          docker build -t admondtamang/myapp:${TAG} exmaples/goserver/
          docker push admondtamang/myapp:${TAG}
